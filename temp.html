<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">

<style>

body{
margin:0;
font-family:Arial, Helvetica, sans-serif;
background:#0f172a;
display:flex;
justify-content:center;
align-items:center;
height:100vh;
}

.card{
width:1100px;
height:620px;
background:#1e293b;
border-radius:40px;
padding:70px;
color:white;
position:relative;
}

.coin{
font-size:60px;
font-weight:700;
}

.rank{
position:absolute;
top:70px;
right:80px;
background:#0f172a;
padding:10px 25px;
border-radius:20px;
font-size:30px;
}

.price{
font-size:90px;
margin-top:40px;
font-weight:700;
}

.price_inr{
font-size:40px;
color:#cbd5e1;
margin-top:10px;
}

.change{
font-size:50px;
margin-top:30px;
font-weight:600;
color:{{color}};
}

.section{
display:flex;
justify-content:space-between;
margin-top:80px;
font-size:40px;
}

.footer{
position:absolute;
bottom:30px;
left:0;
width:100%;
text-align:center;
font-size:28px;
color:#94a3b8;
}

</style>
</head>

<body>

<div class="card">

<div class="coin">{{coin_name}}</div>

<div class="rank">#{{rank}}</div>

<div class="price">${{price_usd}}</div>

<div class="price_inr">₹{{price_inr}}</div>

<div class="change">{{change}}% (24H)</div>

<div class="section">

<div>
<div>Market Cap</div>
<div>${{market_cap}}</div>
</div>

<div>
<div>Volume</div>
<div>${{volume}}</div>
</div>

</div>

<div class="footer">
Updated: {{updated_time}} | CoinoPrice.com
</div>

</div>

</body>
</html>
