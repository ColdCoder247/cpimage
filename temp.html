<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<style>
body {
  margin: 0;
  width: 1080px;
  height: 1080px;
  background: linear-gradient(135deg, #0f172a, #1e293b);
  font-family: 'Segoe UI', sans-serif;
  color: white;
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
}

.title {
  font-size: 60px;
  font-weight: bold;
  margin-bottom: 60px;
}

.container {
  width: 900px;
  display: flex;
  justify-content: space-between;
}

.card {
  width: 420px;
  padding: 40px;
  border-radius: 30px;
  text-align: center;
  box-shadow: 0 20px 60px rgba(0,0,0,0.5);
}

.gainer {
  background: linear-gradient(135deg, #003d2e, #00c853);
}

.loser {
  background: linear-gradient(135deg, #3d0000, #d50000);
}

.card img {
  width: 90px;
  height: 90px;
  background: white;
  border-radius: 50%;
  padding: 10px;
  margin-bottom: 20px;
}

.coin-name {
  font-size: 36px;
  margin-bottom: 10px;
}

.price {
  font-size: 50px;
  margin: 20px 0;
}

.change {
  font-size: 40px;
  font-weight: bold;
}

.footer {
  position: absolute;
  bottom: 40px;
  font-size: 24px;
  opacity: 0.6;
}
</style>
</head>

<body>

<div class="title">📊 Daily Market Wrap</div>

<div class="container">

  <div class="card gainer">
    <h2>🔥 Top Gainer</h2>
    <img src="https://coin-images.coingecko.com/coins/images/51589/large/pippin_logo.png?1731570163">
    <div class="coin-name">pippin</div>
    <div class="price">$0.825291</div>
    <div class="change">+11.88%</div>
  </div>

  <div class="card loser">
    <h2>🔻 Top Loser</h2>
    <img src="https://coin-images.coingecko.com/coins/images/29850/large/pepe-token.jpeg?1696528776">
    <div class="coin-name">Pepe</div>
    <div class="price">$3.82e-06</div>
    <div class="change">-12.63%</div>
  </div>

</div>

<div class="footer">CoinoPrice.com</div>

</body>
</html>
