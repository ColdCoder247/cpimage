<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<style>
body {
  margin: 0;
  width: 1080px;
  height: 1080px;
  background: linear-gradient(135deg, #0f172a, #1e293b);
  font-family: 'Segoe UI', sans-serif;
  color: white;
  padding: 60px;
  box-sizing: border-box;
}

.title {
  text-align: center;
  font-size: 60px;
  font-weight: bold;
  margin-bottom: 40px;
}

.grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  grid-gap: 30px;
}

.card {
  display: flex;
  align-items: center;
  background: rgba(255,255,255,0.05);
  padding: 20px 30px;
  border-radius: 20px;
  backdrop-filter: blur(10px);
}

.card img {
  width: 60px;
  height: 60px;
  border-radius: 50%;
  background: white;
  padding: 5px;
  margin-right: 20px;
}

.coin-info {
  font-size: 28px;
}

.price {
  font-size: 22px;
  opacity: 0.8;
}

.footer {
  text-align: center;
  margin-top: 40px;
  font-size: 24px;
  opacity: 0.6;
}
</style>
</head>

<body>

<div class="title">🏆 Weekly Top 10 Cryptos</div>

<div class="grid">

  <div class="card">
    <img src="https://coin-images.coingecko.com/coins/images/1/large/bitcoin.png?1696501400">
    <div class="coin-info">Bitcoin<div class="price">$67256</div></div>
  </div>

  <div class="card">
    <img src="https://coin-images.coingecko.com/coins/images/279/large/ethereum.png?1696501628">
    <div class="coin-info">Ethereum<div class="price">$2008.19</div></div>
  </div>

  <div class="card">
    <img src="https://coin-images.coingecko.com/coins/images/325/large/Tether.png?1696501661">
    <div class="coin-info">Tether<div class="price">$1.0</div></div>
  </div>

  <div class="card">
    <img src="https://coin-images.coingecko.com/coins/images/44/large/xrp-symbol-white-128.png?1696501442">
    <div class="coin-info">XRP<div class="price">$1.4</div></div>
  </div>

  <div class="card">
    <img src="https://coin-images.coingecko.com/coins/images/825/large/bnb-icon2_2x.png?1696501970">
    <div class="coin-info">BNB<div class="price">$626.24</div></div>
  </div>

  <div class="card">
    <img src="https://coin-images.coingecko.com/coins/images/6319/large/USDC.png?1769615602">
    <div class="coin-info">USDC<div class="price">$0.999981</div></div>
  </div>

  <div class="card">
    <img src="https://coin-images.coingecko.com/coins/images/4128/large/solana.png?1718769756">
    <div class="coin-info">Solana<div class="price">$86.68</div></div>
  </div>

  <div class="card">
    <img src="https://coin-images.coingecko.com/coins/images/1094/large/tron-logo.png?1696502193">
    <div class="coin-info">TRON<div class="price">$0.281825</div></div>
  </div>

  <div class="card">
    <img src="https://coin-images.coingecko.com/coins/images/5/large/dogecoin.png?1696501409">
    <div class="coin-info">Dogecoin<div class="price">$0.094684</div></div>
  </div>

  <div class="card">
    <img src="https://coin-images.coingecko.com/coins/images/68480/large/figure.png?1755863954">
    <div class="coin-info">Figure Heloc<div class="price">$1.029</div></div>
  </div>

</div>

<div class="footer">CoinoPrice.com</div>

</body>
</html>
