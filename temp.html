<!DOCTYPE html>
<html>
<head>
<style>
body {
  margin: 0;
  width: 1080px;
  height: 1080px;
  font-family: 'Segoe UI', sans-serif;
  background: linear-gradient(135deg, #0f172a, #1e293b);
  display: flex;
  align-items: center;
  justify-content: center;
  color: white;
}

.card {
  width: 900px;
  padding: 60px;
  border-radius: 40px;
  background: rgba(255,255,255,0.05);
  backdrop-filter: blur(15px);
  box-shadow: 0 40px 80px rgba(0,0,0,0.5);
}

.header {
  display: flex;
  justify-content: space-between;
  align-items: center;
}

.coin-name {
  font-size: 70px;
  font-weight: 700;
}

.rank {
  background: #111827;
  padding: 12px 30px;
  border-radius: 50px;
  font-size: 32px;
}

.price {
  font-size: 120px;
  margin: 40px 0;
  font-weight: 700;
}

.inr {
  font-size: 40px;
  opacity: 0.7;
}

.change {
  font-size: 60px;
  font-weight: bold;
  margin-top: 20px;
  color: {{color}};
}

.stats {
  margin-top: 60px;
  display: flex;
  justify-content: space-between;
  font-size: 36px;
}

.footer {
  margin-top: 80px;
  font-size: 28px;
  opacity: 0.6;
  text-align: center;
}
</style>
</head>

<body>
<div class="card">

  <div class="header">
    <div class="coin-name">BNB</div>
    <div class="rank">#5</div>
  </div>

  <div class="price">$633.01</div>
  <div class="inr">₹{{price_inr}}</div>

  <div class="change">4.31% (24H)</div>

  <div class="stats">
    <div>
      <div>Market Cap</div>
      <div>${{market_cap}}</div>
    </div>
    <div>
      <div>Volume</div>
      <div>${{volume}}</div>
    </div>
  </div>

  <div class="footer">
    Updated: {{updated_time}}  
    | CoinoPrice.com
  </div>

</div>
</body>
</html>
