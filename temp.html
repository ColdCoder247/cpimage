<!DOCTYPE html>
<html>
<head>

<meta charset="UTF-8">
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>

body{
margin:0;
font-family:Arial;
background:linear-gradient(135deg,#0f172a,#1e293b);
display:flex;
justify-content:center;
align-items:center;
height:100vh;
}

.card{
width:1100px;
height:800px;
background:#1e293b;
border-radius:40px;
padding:70px;
color:white;
position:relative;
}

/* header */

.coin-header{
display:flex;
align-items:center;
gap:20px;
}

.coin-logo{
width:70px;
height:70px;
border-radius:50%;
}

.coin{
font-size:60px;
font-weight:bold;
}

.symbol{
font-size:26px;
color:#94a3b8;
}

/* rank */

.rank{
position:absolute;
top:70px;
right:80px;
background:#0b1220;
padding:10px 25px;
border-radius:20px;
font-size:28px;
}

/* price */

.price{
font-size:90px;
margin-top:30px;
font-weight:700;
}

.price_inr{
font-size:40px;
color:#cbd5e1;
}

/* change line */

.change-line{
display:flex;
gap:40px;
margin-top:20px;
font-size:36px;
}

.change24{
color:#22c55e;
}

.change7{
color:#3b82f6;
}

/* chart */

.chart{
margin-top:40px;
width:650px;
height:260px;
}

/* right stats */

.stats{
position:absolute;
top:220px;
right:80px;
}

.stat{
margin-bottom:45px;
}

.stat-title{
color:#94a3b8;
font-size:24px;
}

.stat-value{
font-size:36px;
font-weight:600;
}

/* footer */

.footer{
position:absolute;
bottom:90px;
width:100%;
text-align:center;
font-size:26px;
color:#94a3b8;
}

</style>
</head>

<body>

<div class="card">

<div class="coin-header">

<img src="https://coin-images.coingecko.com/coins/images/1/large/bitcoin.png?1696501400" class="coin-logo">

<div>
<div class="coin">Bitcoin</div>
<div class="symbol">BTC</div>
</div>

</div>

<div class="rank">#1</div>

<div class="price">$69,323.00</div>
<div class="price_inr">₹5,753,809</div>

<div class="change-line">

<div class="change24">🟢 +2.3% (24H)</div>

<div class="change7">🔵 +6.84% (7D)</div>

</div>

<div class="chart">
<canvas id="spark"></canvas>
</div>

<div class="stats">

<div class="stat">
<div class="stat-title">Market Cap</div>
<div class="stat-value">$1385.56B</div>
</div>

<div class="stat">
<div class="stat-title">Volume</div>
<div class="stat-value">$57.42B</div>
</div>

<div class="stat">
<div class="stat-title">Supply</div>
<div class="stat-value">20.0M</div>
</div>

</div>

<div class="footer">
Updated: 04 Mar 2026 08:31 UTC | CoinoPrice.com
</div>

</div>

<script>

const prices = [65958.6,65315.31,65704.61,65226.86,65736.2,66524.75,66537.97,66291.95,66827.45,66794.9,66737.67,66204.55,65967.07,66248.43,66178.76,66264.52,66338.32,65950.52,65415.51,67038.38,69099.86,69482.0,69165.18,68907.88,68957.55,69250.05,69429.27,69388.34,68810.7,69026.21,68905.3,68751.35,68502.27,68360.79,68110.96,67942.93,68090.58,68158.42,66962.98,66628.77,66813.1,67060.44,67380.54,66923.77,66634.29,67711.78,68206.87,68345.77,68657.75,68457.6,68217.06,68053.56,68265.41,68292.19,68157.54,68416.37,68283.28,67727.15,67767.31,68205.12];

new Chart(document.getElementById("spark"),{

type:"line",

data:{
labels:prices,
datasets:[{
data:prices,
borderColor:"#22c55e",
borderWidth:3,
pointRadius:0,
tension:0.4
}]
},

options:{
plugins:{legend:{display:false}},
scales:{
x:{display:false},
y:{display:false}
}
}

});

</script>

</body>
</html>
