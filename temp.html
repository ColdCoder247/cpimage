<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">

<style>

body{
margin:0;
font-family:Arial, Helvetica, sans-serif;
background:#0f172a;
display:flex;
justify-content:center;
align-items:center;
height:100vh;
}

.card{
width:1100px;
height:620px;
background:#1e293b;
border-radius:40px;
padding:70px;
color:white;
position:relative;
}

/* Header with logo */

.coin-header{
display:flex;
align-items:center;
gap:25px;
}

.coin-logo{
width:70px;
height:70px;
border-radius:50%;
}

.coin{
font-size:60px;
font-weight:700;
}

.rank{
position:absolute;
top:70px;
right:80px;
background:#0f172a;
padding:10px 25px;
border-radius:20px;
font-size:30px;
}

.price{
font-size:90px;
margin-top:40px;
font-weight:700;
}

.price_inr{
font-size:40px;
color:#cbd5e1;
margin-top:10px;
}

.change{
font-size:50px;
margin-top:30px;
font-weight:600;
color:#00ff9c;
}

.section{
display:flex;
justify-content:space-between;
margin-top:80px;
font-size:40px;
}

.footer{
position:absolute;
bottom:30px;
left:0;
width:100%;
text-align:center;
font-size:28px;
color:#94a3b8;
}

</style>
</head>

<body>

<div class="card">

<div class="coin-header">
<img src="https://coin-images.coingecko.com/coins/images/1/large/bitcoin.png?1696501400" class="coin-logo">
<div class="coin">Bitcoin</div>
</div>

<div class="rank">#1</div>

<div class="price">$68,724.00</div>

<div class="price_inr">₹5,704,092</div>

<div class="change">0.87% (24H)</div>

<div class="section">

<div>
<div>Market Cap</div>
<div>$1373.62B</div>
</div>

<div>
<div>Volume</div>
<div>$55.26B</div>
</div>

</div>

<div class="footer">
Updated: 04 Mar 2026 07:39 UTC | CoinoPrice.com
</div>

</div>

</body>
</html>
