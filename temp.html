<!DOCTYPE html>
<html>
<head>

<meta charset="UTF-8">

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>

body{
margin:0;
font-family:Arial;
background:linear-gradient(135deg,#0f172a,#1e293b,#0f172a);
display:flex;
justify-content:center;
align-items:center;
height:100vh;
}

.card{
width:1100px;
height:820px;
background:#1e293b;
border-radius:40px;
padding:70px;
color:white;
position:relative;
box-shadow:0 0 40px rgba(0,0,0,0.5);
}

/* header */

.coin-header{
display:flex;
align-items:center;
gap:25px;
}

.coin-logo{
width:70px;
height:70px;
border-radius:50%;
box-shadow:0 0 20px rgba(255,165,0,0.6);
}

.coin{
font-size:60px;
font-weight:700;
}

.symbol{
font-size:26px;
color:#94a3b8;
}

/* rank badge */

.rank{
position:absolute;
top:70px;
right:80px;
background:#111827;
border:1px solid #374151;
padding:10px 25px;
border-radius:20px;
font-size:28px;
}

/* price */

.price{
font-size:85px;
margin-top:25px;
font-weight:700;
}

.price_inr{
font-size:38px;
color:#cbd5e1;
}

/* changes */

.change{
font-size:42px;
margin-top:20px;
color:#00ff9c;
}

.change7{
font-size:28px;
color:#38bdf8;
}

/* chart */

.chart{
margin-top:40px;
width:600px;
}

/* RIGHT PANEL */

.stats{
position:absolute;
top:260px;
right:80px;
text-align:left;
font-size:34px;
}

.stat{
margin-bottom:40px;
}

.stat-title{
color:#94a3b8;
font-size:26px;
}

.stat-value{
font-size:36px;
font-weight:600;
}

/* footer */

.footer{
position:absolute;
bottom:30px;
left:0;
width:100%;
text-align:center;
font-size:26px;
color:#94a3b8;
}

</style>
</head>

<body>

<div class="card">

<div class="coin-header">

<img src="https://coin-images.coingecko.com/coins/images/1/large/bitcoin.png?1696501400" class="coin-logo">

<div>
<div class="coin">Bitcoin</div>
<div class="symbol">BTC</div>
</div>

</div>

<div class="rank">#1</div>

<div class="price">$69,610.00</div>
<div class="price_inr">₹5,777,630</div>

<div class="change">2.12% (24H)</div>
<div class="change7">7.29% (7D)</div>

<div class="chart">

<div class="stats">

</div>

<div class="stat">

</div>

<div class="stat">
<div class="stat-title">Supply</div>

</div>

</div>

<div class="footer">
