<!DOCTYPE html>
<html>
<head>

<meta charset="UTF-8">

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>

body{
margin:0;
font-family:Arial;
background:linear-gradient(135deg,#0f172a,#1e293b,#0f172a);
display:flex;
justify-content:center;
align-items:center;
height:100vh;
}

.card{
width:1100px;
height:820px;
background:#1e293b;
border-radius:40px;
padding:70px;
color:white;
position:relative;
box-shadow:0 0 40px rgba(0,0,0,0.5);
}

/* header */

.coin-header{
display:flex;
align-items:center;
gap:25px;
}

.coin-logo{
width:70px;
height:70px;
border-radius:50%;
box-shadow:0 0 20px rgba(255,165,0,0.6);
}

.coin{
font-size:60px;
font-weight:700;
}

.symbol{
font-size:26px;
color:#94a3b8;
}

/* rank badge */

.rank{
position:absolute;
top:70px;
right:80px;
background:#111827;
border:1px solid #374151;
padding:10px 25px;
border-radius:20px;
font-size:28px;
}

/* price */

.price{
font-size:85px;
margin-top:25px;
font-weight:700;
}

.price_inr{
font-size:38px;
color:#cbd5e1;
}

/* changes */

.change{
font-size:42px;
margin-top:20px;
color:{{color}};
}

.change7{
font-size:28px;
color:#38bdf8;
}

/* sparkline */

.chart{
margin-top:40px;
width:600px;
}

/* stats */

.section{
display:flex;
justify-content:space-between;
margin-top:60px;
font-size:32px;
}

/* footer */

.footer{
position:absolute;
bottom:30px;
left:0;
width:100%;
text-align:center;
font-size:26px;
color:#94a3b8;
}

</style>
</head>

<body>

<div class="card">

<div class="coin-header">

<img src="{{logo_url}}" class="coin-logo">

<div>

<div class="coin">{{coin_name}}</div>
<div class="symbol">{{symbol}}</div>

</div>

</div>

<div class="rank">#{{rank}}</div>

<div class="price">${{price_usd}}</div>

<div class="price_inr">₹{{price_inr}}</div>

<div class="change">{{change}}% (24H)</div>

<div class="change7">{{change7d}}% (7D)</div>

<div class="chart">

<canvas id="spark"></canvas>

</div>

<div class="section">

<div>
<div>Market Cap</div>
<div>${{market_cap}}</div>
</div>

<div>
<div>Volume</div>
<div>${{volume}}</div>
</div>

<div>
<div>Supply</div>
<div>{{supply}}</div>
</div>

</div>

<div class="footer">
Updated: {{updated_time}} | CoinoPrice.com
</div>

</div>

<script>

const data = [{{sparkline_data}}];

new Chart(document.getElementById("spark"),{

type:"line",

data:{
labels:data,
datasets:[{
data:data,
borderColor:"#22c55e",
borderWidth:3,
pointRadius:0,
fill:false
}]
},

options:{
plugins:{legend:{display:false}},
scales:{
x:{display:false},
y:{display:false}
}
}

});

</script>

</body>
</html>
