<!DOCTYPE html>
<html>
<head>

<meta charset="UTF-8">
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>

body{
margin:0;
font-family:Arial, Helvetica, sans-serif;
background:linear-gradient(135deg,#0f172a,#1e293b);
display:flex;
justify-content:center;
align-items:center;
height:100vh;
}

.card{
width:1100px;
height:820px;
background:#1e293b;
border-radius:40px;
padding:70px;
color:white;
position:relative;
}

/* HEADER */

.coin-header{
display:flex;
align-items:center;
gap:20px;
}

.coin-logo{
width:70px;
height:70px;
border-radius:50%;
}

.coin{
font-size:60px;
font-weight:700;
}

.symbol{
font-size:26px;
color:#94a3b8;
margin-top:4px;
}

/* RANK BADGE */

.rank{
position:absolute;
top:70px;
right:80px;
background:#0b1220;
padding:10px 25px;
border-radius:20px;
font-size:28px;
}

/* PRICE */

.price{
font-size:90px;
margin-top:30px;
font-weight:700;
}

.price_inr{
font-size:40px;
color:#cbd5e1;
}

/* CHANGE LINE */

.change-line{
display:flex;
gap:40px;
margin-top:25px;
font-size:36px;
}

.change24{
color:#22c55e;
}

.change7{
color:#3b82f6;
}

/* CHART */

.chart{
margin-top:40px;
width:650px;
height:260px;
}

#spark{
width:100%;
height:100%;
}

/* RIGHT STATS */

.stats{
position:absolute;
top:220px;
right:80px;
width:260px;
}

.stat{
display:flex;
align-items:center;
gap:15px;
margin-bottom:45px;
}

.stat-icon{
font-size:32px;
width:40px;
text-align:center;
}

.stat-title{
color:#94a3b8;
font-size:24px;
}

.stat-value{
font-size:36px;
font-weight:600;
}

/* FOOTER */

.footer{
position:absolute;
bottom:90px;
width:100%;
text-align:center;
font-size:26px;
color:#94a3b8;
}

</style>
</head>

<body>

<div class="card">

<!-- HEADER -->

<div class="coin-header">

<img src="{{logo_url}}" class="coin-logo">

<div>
<div class="coin">{{coin_name}}</div>
<div class="symbol">{{symbol}}</div>
</div>

</div>

<div class="rank">#{{rank}}</div>

<!-- PRICE -->

<div class="price">${{price_usd}}</div>
<div class="price_inr">₹{{price_inr}}</div>

<!-- CHANGE -->

<div class="change-line">

<div class="change24">🟢 +{{change}}% (24H)</div>

<div class="change7">🔵 +{{change7d}}% (7D)</div>

</div>

<!-- CHART -->

<div class="chart">
<canvas id="spark"></canvas>
</div>

<!-- RIGHT STATS -->

<div class="stats">

<div class="stat">

<div class="stat-icon">💰</div>

<div>
<div class="stat-title">Market Cap</div>
<div class="stat-value">${{market_cap}}</div>
</div>

</div>

<div class="stat">

<div class="stat-icon">📊</div>

<div>
<div class="stat-title">Volume</div>
<div class="stat-value">${{volume}}</div>
</div>

</div>

<div class="stat">

<div class="stat-icon">⛓</div>

<div>
<div class="stat-title">Supply</div>
<div class="stat-value">{{supply}}</div>
</div>

</div>

</div>

<!-- FOOTER -->

<div class="footer">
Updated: {{updated_time}} | CoinoPrice.com
</div>

</div>

<script>

const prices = [{{sparkline_data}}];

new Chart(document.getElementById("spark"),{

type:"line",

data:{
labels:prices,
datasets:[{
data:prices,
borderColor:"#22c55e",
borderWidth:3,
pointRadius:0,
tension:0.4
}]
},

options:{
plugins:{legend:{display:false}},
scales:{
x:{display:false},
y:{display:false}
}
}

});

</script>

</body>
</html>
