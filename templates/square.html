<!DOCTYPE html>
<html>
<head>

<meta charset="UTF-8">
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>

body{
margin:0;
font-family:Arial, Helvetica, sans-serif;
background:linear-gradient(135deg,#0f172a,#1e293b,#0f172a);
display:flex;
justify-content:center;
align-items:center;
height:100vh;
}

.card{
width:1100px;
height:820px;
background:#1e293b;
border-radius:40px;
padding:70px;
color:white;
position:relative;
box-shadow:0 0 40px rgba(0,0,0,0.5);
}

/* HEADER */

.coin-header{
display:flex;
align-items:center;
gap:20px;
}

.coin-logo{
width:70px;
height:70px;
border-radius:50%;
box-shadow:0 0 18px rgba(255,165,0,0.6);
}

.coin{
font-size:60px;
font-weight:700;
}

.symbol{
font-size:26px;
color:#94a3b8;
margin-top:5px;
}

/* RANK BADGE */

.rank{
position:absolute;
top:70px;
right:80px;
background:#0b1220;
border:1px solid #2a3347;
padding:10px 25px;
border-radius:20px;
font-size:28px;
}

/* PRICE */

.price{
font-size:90px;
margin-top:30px;
font-weight:700;
}

.price_inr{
font-size:40px;
color:#cbd5e1;
}

/* CHANGE INDICATORS */

.change{
margin-top:25px;
font-size:40px;
color:#22c55e;
}

.change7{
font-size:28px;
color:#3b82f6;
}

/* CHART */

.chart{
margin-top:40px;
width:600px;
}

/* RIGHT STATS PANEL */

.stats{
position:absolute;
top:230px;
right:80px;
}

.stat{
margin-bottom:45px;
display:flex;
align-items:center;
gap:12px;
}

.stat-icon{
font-size:26px;
}

.stat-title{
color:#94a3b8;
font-size:24px;
}

.stat-value{
font-size:36px;
font-weight:600;
}

/* FOOTER */

.footer{
position:absolute;
bottom:100px;
width:100%;
text-align:center;
font-size:26px;
color:#94a3b8;
letter-spacing:1px;
}

</style>
</head>

<body>

<div class="card">

<!-- HEADER -->

<div class="coin-header">

<img src="{{logo_url}}" class="coin-logo">

<div>
<div class="coin">{{coin_name}}</div>
<div class="symbol">{{symbol}}</div>
</div>

</div>

<div class="rank">#{{rank}}</div>

<!-- PRICE -->

<div class="price">${{price_usd}}</div>
<div class="price_inr">₹{{price_inr}}</div>

<!-- CHANGE -->

<div class="change">🟢 +{{change}}% (24H)</div>
<div class="change7">🔵 +{{change7d}}% (7D)</div>

<!-- CHART -->

<div class="chart">
<canvas id="spark"></canvas>
</div>

<!-- RIGHT PANEL -->

<div class="stats">

<div class="stat">
<div class="stat-icon">💰</div>
<div>
<div class="stat-title">Market Cap</div>
<div class="stat-value">${{market_cap}}</div>
</div>
</div>

<div class="stat">
<div class="stat-icon">📊</div>
<div>
<div class="stat-title">Volume</div>
<div class="stat-value">${{volume}}</div>
</div>
</div>

<div class="stat">
<div class="stat-icon">⛓️</div>
<div>
<div class="stat-title">Supply</div>
<div class="stat-value">{{supply}}</div>
</div>
</div>

</div>

<!-- FOOTER -->

<div class="footer">
Updated: {{updated_time}} | CoinoPrice.com
</div>

</div>

<script>

const data = [{{sparkline_data}}];

new Chart(document.getElementById("spark"),{

type:"line",

data:{
labels:data,
datasets:[{
data:data,
borderColor:"#22c55e",
borderWidth:3,
pointRadius:0,
fill:false
}]
},

options:{
plugins:{legend:{display:false}},
scales:{
x:{display:false},
y:{display:false}
}

});

</script>

</body>
</html>
