name: Crypto Auto Engine

on:
  schedule:
    - cron: "0 6 * * *"
    - cron: "0 10 * * *"
    - cron: "0 14 * * *"
    - cron: "0 18 * * *"
    - cron: "0 8 * * 0"
  workflow_dispatch:

jobs:

  build:

    runs-on: ubuntu-latest

    steps:

      - uses: actions/checkout@v3

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"

      - name: Install Dependencies
        run: |
          pip install -r requirements.txt
          playwright install chromium

      - name: Generate Crypto Image
        run: python generate.py

      - name: Commit Generated Images
        run: |
          git config --global user.name "crypto-bot"
          git config --global user.email "bot@github.com"
          git add output/*
          git commit -m "Auto crypto update" || echo "No changes"
          git push
